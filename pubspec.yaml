name: vyro
description: VYRO — nutrição e treino, com privacidade por defeito.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  camera: ^0.12.1
  dio: 5.11.1
  drift: 2.35.2
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_litert: ^3.9.4
  image: ^4.12.0
  image_picker: ^1.2.4
  mobile_scanner: 7.4.2
  home_widget: 0.10.0
  quick_actions: 1.1.1
flutter:
  uses-material-design: true
  assets:
    - brand/logos/vyro-mark-dark.svg
    - brand/logos/vyro-mark-lime.svg
    - brand/logos/vyro-wordmark.svg
    - assets/models/aiy_food_v1.tflite
    - assets/models/aiy_food_v1_labels.csv
    - assets/models/movenet_lightning_fp16.tflite
dev_dependencies:
  build_runner: 2.17.1
  drift_dev: 2.35.2
  flutter_test:
    sdk: flutter
